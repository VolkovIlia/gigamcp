name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json
      - run: npm ci
      - name: MCP-клиент, OAuth, мост, протокол
        run: node node-tests.mjs
      - name: Установка Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: E2E с расширением
        run: node e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: test/shots/
