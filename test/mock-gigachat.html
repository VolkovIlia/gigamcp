<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ГигаЧат (макет)</title>
<style>
  body { margin: 0; background: radial-gradient(circle at 30% 20%, #1d3b4a, #0c1418 70%); color: #e8eaed; font: 15px/1.5 system-ui, sans-serif; min-height: 100vh; }
  #root { max-width: 820px; margin: 0 auto; padding: 24px 16px 200px; }
  .Message-styled__User { margin: 16px 0 16px auto; max-width: 70%; background: #2a2f36; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; }
  .Message-styled__Bot { margin: 16px 0; }
  pre { background: #11161a; padding: 10px; border-radius: 10px; overflow: auto; }
  form { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(780px, calc(100vw - 32px)); background: #23282e; border-radius: 20px; padding: 10px 12px; }
  textarea { width: 100%; background: transparent; border: 0; color: inherit; font: inherit; resize: none; outline: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row button { background: #2f353c; color: #ddd; border: 0; border-radius: 12px; padding: 4px 10px; }
  .grow { flex: 1; }
</style></head>
<body><div id="root"><div class="ChatView-styled__Messages" id="msgs"></div></div>
<form id="f" class="ChatInput-styled__Form">
  <textarea id="chat-input-textarea" aria-label="Сообщение" rows="2" placeholder="Спросите ГигаЧат"></textarea>
  <div class="row">
    <button type="button" aria-label="Прикрепить файл">📎</button>
    <div class="modes"><button type="button" class="InputModeMobile">Гига</button></div>
    <span class="grow"></span>
    <button type="button" id="stop" aria-label="Остановить генерацию" hidden>■</button>
    <button type="submit" aria-label="Отправить">➤</button>
  </div>
</form>
<script>
  const ta = document.getElementById('chat-input-textarea');
  const msgs = document.getElementById('msgs');
  const stop = document.getElementById('stop');
  window.__sent = [];
  function md(text) {
    // примитивный markdown: только блоки кода
    const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    return esc(text).replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => `<pre><code class="language-${lang}">${code}</code></pre>`).replace(/\n/g, '<br>');
  }
  function botReply(user) {
    if (user.startsWith('[MCP-РЕЗУЛЬТАТ]')) {
      // посреди цепочки ГигаЧат уходит во встроенные навыки (как со «Создал файл» в настоящем чате)
      if (/успешно\nчерновик\n/.test(user)) return 'Ошибка при вызове инструмента. Создал файл поздравление.txt';
      const m = user.match(/успешно\n([^\n]+)/);
      return `Готово: ${m ? m[1] : '?'}`;
    }
    if (user.startsWith('[MCP-НАПОМИНАНИЕ]')) {
      if (/все слайды/i.test(user)) return '```mcp\n{"call": "test/echo", "arguments": {"text": "все слайды прочитаны"}}\n```';
      if (/документ/i.test(user)) return '```mcp\n{"call": "test/echo", "arguments": {"text": "документ сохранён"}}\n```';
      return '```mcp\n{"call": "test/echo", "arguments": {"text": "задача 1"}}\n```';
    }
    // как в настоящем ГигаЧате: «Думаю над ответом» с шагами встроенных навыков по кругу
    if (/все слайды/i.test(user)) return { loop: 40, steps: ['Завершил поиск подходящих навыков', 'Узнал дату и время', 'Ошибка при вызове инструмента'] };
    // обычное «исследование»: много поисков, но без ошибок — останавливать нельзя
    if (/исследуй/i.test(user)) return { loop: 3, steps: ['Завершил поиск подходящих навыков', 'Завершил поиск подходящих навыков', 'Нашёл информацию в интернете'], text: 'Исследование готово.' };
    if (/создай документ/i.test(user)) {
      return '```mcp\n{"call": "test/echo", "arguments": {"text": "черновик"}}\n```';
    }
    if (/через echo/i.test(user)) {
      return '```mcp\n{"call": "test/echo", "arguments": {"text": "привет"}}\n```';
    }
    if (/список дел/i.test(user)) {
      return 'Ошибка при вызове инструмента. Ответ: Этот запрос относится к поиску данных в системе управления задачами.';
    }
    if (/мои задачи/i.test(user)) {
      return 'Я не могу показать задачи, так как у меня нет доступа к твоим данным.';
    }
    if (/демо/i.test(user)) {
      return 'Спрошу локальную программу.\n```mcp\n{"call": "demo/add", "arguments": {"a": 7, "b": 8}}\n```';
    }
    if (/посчитай|сколько/i.test(user)) {
      return 'Сейчас посчитаю.\n```mcp\n{"call": "test/add", "arguments": {"a": 2, "b": 3}}\n```';
    }
    return 'Обычный ответ без инструментов.';
  }
  let stopped = false;
  window.__stopped = false;
  stop.addEventListener('click', () => { stopped = true; window.__stopped = true; });
  async function stream(reply) {
    const wrap = document.createElement('div');
    wrap.className = 'Message-styled__Bot';
    const body = document.createElement('div');
    body.className = 'Markdown-styled__Root';
    wrap.appendChild(body);
    msgs.appendChild(wrap);
    stop.hidden = false;
    stopped = false;
    if (reply.loop) {
      // разметка шагов — как на giga.chat: ToolCallLogBlock → LogTimeline-styled__ItemLabel
      const log = document.createElement('div');
      log.className = 'ToolCallLogBlock-styled__ToolCallLogBlockRoot-sc-1 x';
      wrap.insertBefore(log, body);
      const steps = reply.steps;
      for (let i = 0; i < reply.loop * steps.length && !stopped; i++) {
        const row = document.createElement('div');
        row.className = 'LogTimeline-styled__ItemBlock-sc-2 y';
        row.innerHTML = `<span class="LogTimeline-styled__ItemLabel-sc-3 z">${steps[i % steps.length]}</span>`;
        log.appendChild(row);
        await new Promise((r) => setTimeout(r, 150));
      }
      if (reply.text && !stopped) body.innerHTML = md(reply.text);
      stop.hidden = true;
      return;
    }
    let acc = '';
    for (const ch of reply.match(/.{1,6}/gs)) { acc += ch; body.innerHTML = md(acc); await new Promise((r) => setTimeout(r, 25)); }
    stop.hidden = true;
  }
  async function send() {
    const v = ta.value;
    if (!v.trim()) return;
    window.__sent.push(v);
    ta.value = '';
    const u = document.createElement('div');
    u.className = 'Message-styled__User';
    u.textContent = v;
    msgs.appendChild(u);
    await new Promise((r) => setTimeout(r, 200));
    await stream(botReply(v));
  }
  document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); send(); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script></body></html>
